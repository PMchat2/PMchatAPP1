name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-22.04  # 固定使用 Ubuntu 22.04 以确保兼容性

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装系统级依赖（Java、Android 构建工具等）
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      # 2. 设置 Python 3.11 环境
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装 Python 依赖
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      # 4. 配置 Android SDK 和 NDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4  # v4 版本已迁移至 Node 24，解决警告
        with:
          cmdline-tools-version: '20.0'  # 使用新版 cmdline-tools

      # 5. 接受 Android SDK 许可协议（自动化）
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # 6. 执行 Buildozer 构建
      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      # 7. 上传生成的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
